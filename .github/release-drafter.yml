name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
sort-direction: ascending
categories:
  # 1. Version Resolver Categories (New Schema)
  - type: "version-resolver"
    when:
      labels:
        - "breaking-change"
    semver-increment: "major"

  - type: "version-resolver"
    when:
      labels:
        - "feature"
    semver-increment: "minor"

  - type: "version-resolver"
    when:
      labels:
        - "bugfix"
        - "fix"
        - "bug"
        - "chore"
    semver-increment: "patch"

  - type: "version-resolver"
    semver-increment: "patch" # Default fallback

  # 2. Changelog Grouping Categories (Updated 'when' syntax)
  - title: "💥 Breaking Change 💥"
    when:
      labels:
        - "breaking-change"

  - title: "⚡ Enhancements ⚡"
    when:
      labels:
        - "enhancement"

  - title: "✨ New Features ✨"
    when:
      labels:
        - "feature"

  - title: "🐛 Bug Fixes 🐛"
    when:
      labels:
        - "fix"
        - "bugfix"
        - "bug"

  - title: "🔧 Maintenance 🔧"
    when:
      labels:
        - "chore"

  - title: "🎓 Code Quality 🎓"
    when:
      labels:
        - "code-quality"

  - title: "🔩 Dependency 🔩"
    when:
      labels:
        - "dependencies"
autolabeler:
  - label: "chore"
    title:
      - "/chore:/i"
  - label: "bugfix"
    title:
      - "/fix:/i"
  - label: "feature"
    title:
      - "/feat:/i"
  - label: "enhancement"
    title:
      - "/refactor:/i"
  - label: "code-quality"
    title:
      - "/tests:/i"
  - label: "integration"
    files:
      - "custom_components/**/*"
  - label: "tests"
    files:
      - "tests/**/*"
  - label: "ci"
    files:
      - ".github/workflows/**/*"
      - ".github/release-drafter.yml"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
  - label: "documentation"
    files:
      - "README.md"
      - "CONTRIBUTING.md"
      - "info.md"
template: |
  [![Downloads for this release](https://img.shields.io/github/downloads/firstof9/ha-openei/$RESOLVED_VERSION/total.svg)](https://github.com/firstof9/ha-openei/releases/$RESOLVED_VERSION)

  $CHANGES

  ## Links
  - [Submit bugs/feature requests](https://github.com/firstof9/ha-openei/issues)
